# Manifest checks. The repo is public, so pull requests and pushes to main
# run this job (GATE-001). Python, container, and shared gates live in ci.yml.
# The default GITHUB_TOKEN makes public submodule clones return 404.
# Checkout the repo without credentials, then init submodules anonymously.

name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout analog submodules when a read token exists
        env:
          TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "GUARDRAILS_READ_TOKEN is unset. Analog repos are private, so this job parses YAML only."
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" submodule update --init --depth 1

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Validate issues.yml
        if: hashFiles('.github/scaffold/scripts/issues-sync.py') != ''
        run: python3 .github/scaffold/scripts/issues-sync.py --yaml docs/issues.yml --validate-only

      - name: Parse YAML configs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          paths = [
              Path("docs/issues.yml"),
              Path("docs/issues-sync-targets.yml"),
              Path("docs/guardrail-deviations.yml"),
              Path(".github/dependabot.yml"),
              Path(".github/workflows/quality.yml"),
          ]
          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"ok {path}")
          PY
