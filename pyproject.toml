[project]
name = "delphi-engine"
version = "0.1.0"
description = "Workspace root for Delphi Engine. The installable packages are the members."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "contracts",
    "delphi",
    "daedalus",
    "prometheus",
    "epimetheus",
    "hermes",
]

[tool.uv.sources]
delphi-contracts = { workspace = true }
delphi = { workspace = true }
daedalus = { workspace = true }
delphi-prometheus = { workspace = true }
epimetheus = { workspace = true }
hermes = { workspace = true }

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
no_implicit_optional = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
mypy_path = [
    "contracts/src",
    "delphi/src",
    "daedalus/src",
    "prometheus/src",
    "epimetheus/src",
    "hermes/src",
]
exclude = [
    "^docs/guardrails/",
    "^\\.github/",
    "^\\.devops/",
    "^\\.venv/",
]

[[tool.mypy.overrides]]
module = [
    "contracts.tests.*",
    "delphi.tests.*",
    "daedalus.tests.*",
    "prometheus.tests.*",
    "epimetheus.tests.*",
    "hermes.tests.*",
]
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
