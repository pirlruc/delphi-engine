# Prototype store (SYS-002). Default `scripts/serve_prototype.py` still uses an
# in-memory catalog so unit tests do not need Docker. Compose brings up API plus
# Postgres 16 / pgvector when you want the SQL backend locally.
#
#   docker compose up --build
#   curl -s http://127.0.0.1:8000/health

services:
  postgres:
    image: pgvector/pgvector@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    environment:
      POSTGRES_USER: delphi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: delphi
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delphi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - delphi-pg:/var/lib/postgresql/data

  delphi:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    environment:
      DELPHI_DATABASE_URL: postgresql://delphi:${POSTGRES_PASSWORD}@postgres:5432/delphi
      DELPHI_LLM_KIND: fake
      DELPHI_API_KEY: ${DELPHI_API_KEY:?set DELPHI_API_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g

volumes:
  delphi-pg:
