# Prototype store (SYS-002). The default `scripts/serve_prototype.py` uses an
# in-memory catalog so unit tests and the first demo do not require Docker.
# Bring this stack up when you want Postgres 16 + pgvector locally.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: delphi
      POSTGRES_PASSWORD: delphi
      POSTGRES_DB: delphi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delphi"]
      interval: 5s
      timeout: 5s
      retries: 10
